<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code the Critter</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #e0f7fa;
    }
    #game-board {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 2px;
      margin: 20px auto;
      width: max-content;
    }
    .cell {
      width: 60px;
      height: 60px;
      border: 1px solid #ccc;
      background: #fff;
      position: relative;
      box-sizing: border-box;
    }
    .goal {
      background-color: #81c784;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .key {
      background-color: #ffeb3b;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .obstacle {
      background-color: #ef5350;
    }
    .critter-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
    }
    #code-blocks, #code-sequence {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px auto;
      flex-wrap: wrap;
    }
    .block {
      padding: 10px 15px;
      background: #4dd0e1;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
    }
    .drop-zone {
      min-height: 50px;
      min-width: 60px;
      background: #f1f8e9;
      border: 2px dashed #aed581;
      border-radius: 5px;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      margin: 8px;
      padding: 10px 20px;
      font-size: 16px;
    }
    #message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #388e3c;
    }
  </style>
</head>
<body>

<h1>Code the Critter</h1>
<h2 id="level-title">Level 1</h2>

<div id="game-board"></div>

<h2>Code Blocks</h2>
<div id="code-blocks">
  <div class="block" data-cmd="forward" onclick="addToCodeSequence(event)">Forward</div>
  <div class="block" data-cmd="right" onclick="addToCodeSequence(event)">Turn Right</div>
  <div class="block" data-cmd="left" onclick="addToCodeSequence(event)">Turn Left</div>
</div>

<h2>Code Sequence</h2>
<div id="code-sequence" class="drop-zone"></div>

<button onclick="runCode()">Run Code</button>
<button onclick="resetCritterOnly()">Reset Critter Only</button>
<button onclick="resetLevel()">Reset Level</button>
<button onclick="nextLevel()" id="next-button" style="display:none;">Next Level</button>

<div id="message"></div>

<script>
  const gridSize = 5;
  let critterX = 0, critterY = 0;
  let direction = 'right';
  let level = 1;
  let obstacles = [];
  let keyCollected = false;
  let imagesCollected = 0;

  function createBoard() {
    const board = document.getElementById('game-board');
    board.innerHTML = '';
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${x}-${y}`;
        if (x === 4 && y === 4) {
          cell.classList.add('goal');
          cell.textContent = 'Goal';
        }
        if (level === 3 && x === 2 && y === 2) {
          cell.classList.add('key');
          const keyImg = document.createElement('img');
          keyImg.src = 'IMG_1186.png';
          keyImg.style.width = '40px';
          keyImg.style.height = '40px';
          cell.appendChild(keyImg);
        }
        if (level === 4 && (x === 2 && y === 1 || x === 1 && y === 3)) {
          const image = document.createElement('img');
          image.src = x === 2 && y === 1 ? 'IMG_1147.png' : 'IMG_1144.png';
          image.style.width = '40px';
          image.style.height = '40px';
          cell.appendChild(image);
        }
        board.appendChild(cell);
      }
    }
    drawCritter();
  }

  function drawCritter() {
    document.querySelectorAll('.cell').forEach(c => {
      if (c.classList.contains('goal')) {
        c.textContent = 'Goal';
      } else if (!c.classList.contains('obstacle') && !c.classList.contains('key')) {
        c.innerHTML = '';
      }
    });

    const cell = document.getElementById(`cell-${critterX}-${critterY}`);
    if (!cell) return;
    const img = document.createElement('img');
    img.src = 'IMG_1160.png';
    img.className = 'critter-img';
    cell.appendChild(img);
  }

  function resetLevel() {
    if (level === 1) {
      level = 1;
    } else if (level === 2) {
      level = 2;
    } else if (level === 3) {
      level = 3;
    } else if (level === 4) {
      level = 4;
    }
    critterX = 0;
    critterY = 0;
    direction = 'right';
    keyCollected = false;
    imagesCollected = 0;
    obstacles = [];
    createBoard();
    document.getElementById('message').textContent = '';
    document.getElementById('code-sequence').innerHTML = '';
    document.getElementById('next-button').style.display = 'none';
  }

  function resetCritterOnly() {
    critterX = 0;
    critterY = 0;
    direction = 'right';
    keyCollected = false;
    imagesCollected = 0;
    document.getElementById('message').textContent = '';
    createBoard();
  }

  function runCode() {
    const commands = Array.from(document.getElementById('code-sequence').children).map(el => el.dataset.cmd);
    let step = 0;
    const interval = setInterval(() => {
      if (step >= commands.length) {
        clearInterval(interval);
        checkGoal();
        return;
      }
      if (!processCommand(commands[step])) {
        clearInterval(interval);
        document.getElementById('message').textContent = 'Oops! You hit an obstacle!';
        return;
      }
      drawCritter();
      step++;
    }, 500);
  }

  function processCommand(cmd) {
    let newX = critterX;
    let newY = critterY;

    if (cmd === 'forward') {
      if (direction === 'right') newX++;
      else if (direction === 'left') newX--;
      else if (direction === 'down') newY++;
      else if (direction === 'up') newY--;
    } else if (cmd === 'right') {
      direction = { right: 'down', down: 'left', left: 'up', up: 'right' }[direction];
      return true;
    } else if (cmd === 'left') {
      direction = { right: 'up', up: 'left', left: 'down', down: 'right' }[direction];
      return true;
    }

    if (newX < 0 || newX >= gridSize || newY < 0 || newY >= gridSize) return false;

    // Check for images in level 4
    if (level === 4) {
      if (newX === 2 && newY === 1 && imagesCollected < 1) {
        imagesCollected++;
        document.getElementById('message').textContent = 'You collected IMG_1147! Find IMG_1144!';
      } else if (newX === 1 && newY === 3 && imagesCollected < 2) {
        imagesCollected++;
        document.getElementById('message').textContent = 'You collected IMG_1144! Now reach the goal!';
      }
    }
    
    critterX = newX;
    critterY = newY;
    return true;
  }

  function checkGoal() {
    if (critterX === 4 && critterY === 4 && (level !== 3 || keyCollected || (level === 4 && imagesCollected === 2))) {
      document.getElementById('message').textContent = 'You reached the goal!';
      if (level === 1) {
        level = 2;
        document.getElementById('level-title').textContent = 'Level 2';
        createBoard();
      } else if (level === 2) {
        level = 3;
        document.getElementById('level-title').textContent = 'Level 3';
        createBoard();
      } else if (level === 3) {
        level = 4;
        document.getElementById('level-title').textContent = 'Level 4';
        createBoard();
      } else if (level === 4) {
        document.getElementById('message').textContent = 'You won the game!';
        document.getElementById('next-button').style.display = 'inline-block';
      }
    } else {
      document.getElementById('message').textContent = 'Not quite! Try again.';
    }
  }

  function nextLevel() {
    level = 4;
    document.getElementById('level-title').textContent = 'Level 4';
    document.getElementById('next-button').style.display = 'none';
    critterX = 0;
    critterY = 0;
    direction = 'right';
    createBoard();
  }

  function addToCodeSequence(event) {
    const cmd = event.target.dataset.cmd;
    const codeSequence = document.getElementById('code-sequence');
