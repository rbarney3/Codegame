<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code the Critter – Levels</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #e0f7fa; }
    #game-board { display: grid; grid-template-columns: repeat(5, 60px); margin: 20px auto; gap: 2px; }
    .cell { width: 60px; height: 60px; border: 1px solid #ccc; background: #fff; position: relative; }
    .goal { background-color: #81c784; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .obstacle { background-color: #ef5350; }
    #code-blocks, #code-sequence { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .block { padding: 10px 15px; background: #4dd0e1; color: white; border-radius: 5px; cursor: grab; user-select: none; }
    .drop-zone { min-height: 40px; min-width: 60px; background: #f1f8e9; border: 1px dashed #aed581; border-radius: 5px; padding: 10px; }
    button { margin-top: 15px; padding: 10px 20px; font-size: 16px; margin-right: 10px; }
    #message { margin-top: 20px; font-size: 20px; font-weight: bold; color: #388e3c; }
    .critter-img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>

<h1>Code the Critter</h1>
<h2 id="level-title">Level 1</h2>

<div id="game-board"></div>

<h2>Code Blocks</h2>
<div id="code-blocks">
  <div class="block" draggable="true" data-cmd="forward" ontouchstart="touchDragStart(event)" ontouchend="touchDrop(event)">Forward</div>
  <div class="block" draggable="true" data-cmd="right" ontouchstart="touchDragStart(event)" ontouchend="touchDrop(event)">Turn Right</div>
  <div class="block" draggable="true" data-cmd="left" ontouchstart="touchDragStart(event)" ontouchend="touchDrop(event)">Turn Left</div>
</div>

<h2>Drop Commands Here</h2>
<div id="code-sequence" class="drop-zone" ontouchstart="touchDrop(event)"></div>

<button onclick="runCode()">Run Code</button>
<button onclick="resetGame()">Reset All</button>
<button onclick="resetCritterOnly()">Reset Critter Only</button>
<button onclick="nextLevel()" id="next-button" style="display:none;">Next Level</button>

<div id="message"></div>

<script>
  const gridSize = 5;
  let critterX = 0, critterY = 0;
  let direction = 'right';
  let level = 1;
  let obstacles = [];

  function createBoard() {
    const board = document.getElementById('game-board');
    board.innerHTML = '';
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${x}-${y}`;
        if (x === 4 && y === 4) {
          cell.classList.add('goal');
          cell.textContent = 'Goal';
        }
        board.appendChild(cell);
      }
    }
    drawObstacles();
    drawCritter();
  }

  function drawObstacles() {
    obstacles.forEach(pos => {
      const cell = document.getElementById(`cell-${pos.x}-${pos.y}`);
      if (cell && !cell.classList.contains('goal')) {
        cell.classList.add('obstacle');
      }
    });
  }

  function drawCritter() {
    document.querySelectorAll('.cell').forEach(c => {
      if (c.classList.contains('goal')) {
        c.textContent = 'Goal';
      } else if (!c.classList.contains('obstacle')) {
        c.innerHTML = '';
      }
    });

    const critterCell = document.getElementById(`cell-${critterX}-${critterY}`);
    if (!critterCell) return;
    const img = document.createElement('img');
    img.src = 'IMG_1160.png';
    img.className = 'critter-img';
    critterCell.appendChild(img);
  }

  function resetGame() {
    critterX = 0;
    critterY = 0;
    direction = 'right';
    document.getElementById('message').textContent = '';
    document.getElementById('code-sequence').innerHTML = '';
    document.getElementById('next-button').style.display = 'none';
    createBoard();
  }

  function resetCritterOnly() {
    critterX = 0;
    critterY = 0;
    direction = 'right';
    document.getElementById('message').textContent = '';
    createBoard();
  }

  function runCode() {
    const commands = Array.from(document.getElementById('code-sequence').children).map(el => el.dataset.cmd);
    let step = 0;
    const interval = setInterval(() => {
      if (step >= commands.length) {
        clearInterval(interval);
        checkGoal();
        return;
      }
      if (!processCommand(commands[step])) {
        clearInterval(interval);
        document.getElementById('message').textContent = 'Oops! You hit an obstacle!';
        return;
      }
      drawCritter();
      step++;
    }, 500);
  }

  function checkGoal() {
    if (critterX === 4 && critterY === 4) {
      document.getElementById('message').textContent = 'Great job! You reached the goal!';
      if (level === 1) document.getElementById('next-button').style.display = 'inline-block';
    } else {
      document.getElementById('message').textContent = 'Oops! Try again.';
    }
  }

  function processCommand(cmd) {
    let newX = critterX;
    let newY = critterY;

    if (cmd === 'forward') {
      if (direction === 'right') newX++;
      else if (direction === 'left') newX--;
      else if (direction === 'down') newY++;
      else if (direction === 'up') newY--;
    } else if (cmd === 'right') {
      direction = { right: 'down', down: 'left', left: 'up', up: 'right' }[direction];
      return true;
    } else if (cmd === 'left') {
      direction = { right: 'up', up: 'left', left: 'down', down: 'right' }[direction];
      return true;
    }

    if (newX < 0 || newX >= gridSize || newY < 0 || newY >= gridSize) return false;
    if (obstacles.some(ob => ob.x === newX && ob.y === newY)) return false;

    critterX = newX;
    critterY = newY;
    return true;
  }

  // Drag & Drop
  document.querySelectorAll('.block').forEach(block => {
    block.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', block.dataset.cmd);
    });
  });

  const sequenceZone = document.getElementById('code-sequence');
  sequenceZone.addEventListener('dragover', e => e.preventDefault());
  sequenceZone.addEventListener('drop', e => {
    e.preventDefault();
    const cmd = e.dataTransfer.getData('text/plain');
    addCommandBlock(cmd);
  });

  // Touch support
  let draggedCmd = null;
  function touchDragStart(e) { draggedCmd = e.target.dataset.cmd; }
  function touchDrop(e) {
    if (draggedCmd) {
      addCommandBlock(draggedCmd);
      draggedCmd = null;
    }
  }

  function addCommandBlock(cmd) {
    const newBlock = document
